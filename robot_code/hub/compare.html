<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side by Side</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d11;
    --panel: #10151b;
    --border: #232b35;
    --text: #e8ecf1;
    --text-dim: #8994a3;
    --green: #3ddc84;
    --amber: #ffb020;
    --blue: #4da3ff;
    --red: #ff5c5c;
    --mono: "Martian Mono", ui-monospace, "SF Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-auto-rows: minmax(80vh, auto); } }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--border);
    border-top: 3px solid var(--c); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px;
    font-family: var(--mono); font-size: 13px; }
  .bar strong { color: var(--c); }
  .bar a { color: var(--text-dim); font-size: 11px; text-decoration: none; text-transform: uppercase; letter-spacing: .08em; }
  .bar a:hover { color: var(--text); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  .wait { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
    color: var(--text-dim); font-size: 16px; }
  .wait.bad { color: var(--red); }
</style>
</head>
<body>
<template id="paneTpl">
  <div class="pane">
    <div class="bar"><strong data-role="title"></strong><a data-role="own" href="#">own window ↗</a></div>
    <div class="wait" data-role="wait">Connecting to the hub…</div>
    <iframe data-role="frame" allow="microphone; camera; autoplay; clipboard-write" hidden></iframe>
  </div>
</template>
<script>
  // Two module pages side by side; ?set= picks which. Each pane shows its page as soon as the
  // service behind it is running, and a status note until then.
  //   ood  Part 1 "Teach & Replay": Module 1's teach page | its recognize view
  //        (Module 1 started with --dual-view, both from the same camera frames and memory)
  const SETS = {
    ood: {
      title: 'Teach & Replay',
      panes: [
        { service: 'module1', path: '?compact=1', title: 'Teach · the robot asks and learns', color: 'var(--green)' },
        { service: 'module1', path: 'recognize', title: 'Replay · recognized from memory', color: 'var(--green)' },
      ],
    },
  };
  const set = SETS[new URLSearchParams(location.search).get('set')] || SETS.ood;
  document.title = set.title;

  const panes = set.panes.map(function (cfg, i) {
    const el = document.getElementById('paneTpl').content.firstElementChild.cloneNode(true);
    el.style.setProperty('--c', cfg.color);
    el.querySelector('[data-role="title"]').textContent = cfg.title;
    el.querySelector('[data-role="own"]').target = 'robot-demo-compare-' + i;
    el.querySelector('[data-role="frame"]').title = cfg.title;
    document.body.appendChild(el);
    return { cfg: cfg, el: el };
  });
  function part(pane, role) { return pane.el.querySelector('[data-role="' + role + '"]'); }

  function render(services) {
    panes.forEach(function (pane) {
      const s = services[pane.cfg.service];
      const frame = part(pane, 'frame'), wait = part(pane, 'wait');
      const url = s.url + pane.cfg.path;
      part(pane, 'own').href = url;
      if (s.state === 'running') {
        if (frame.dataset.src !== url) { frame.dataset.src = url; frame.src = url; }
        frame.hidden = false; wait.hidden = true;
        return;
      }
      if (frame.dataset.src) { frame.removeAttribute('src'); delete frame.dataset.src; }
      frame.hidden = true; wait.hidden = false;
      wait.classList.toggle('bad', s.state === 'crashed');
      wait.textContent = s.state === 'starting'
        ? s.title + ' is starting… (loading models' + (pane.cfg.service === 'module2' ? ', about a minute' : '') + ')'
        : s.state === 'crashed'
          ? s.title + ' stopped with an error -- open its Log on the main page.'
          : s.title + ' is not running -- start it from the main page.';
    });
  }

  async function poll() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      if (r.ok) render((await r.json()).services);
    } catch (e) {
      panes.forEach(function (pane) {
        if (part(pane, 'frame').hidden) part(pane, 'wait').textContent = 'The hub is not reachable -- is hub_app.py running?';
      });
    }
    setTimeout(poll, 1500);
  }
  poll();
</script>
</body>
</html>
